services:
  web:
    build: .
    container_name: lyp-app
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - db
    networks:
      - traefik
      - internal
    volumes:
      - ./:/var/www/html
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.lyp-app.rule=Host(`lyp.nkyriopoulos.com`)"
      - "traefik.http.routers.lyp-app.entrypoints=websecure"
      - "traefik.http.routers.lyp-app.tls.certresolver=le"
      - "traefik.http.services.lyp-app.loadbalancer.server.port=80"

  db:
    image: mariadb:11
    container_name: lyp-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - ./data:/var/lib/mysql
      - ./db-init:/docker-entrypoint-initdb.d
    networks:
      - internal
    # No `expose`/`ports` and NOT on the `traefik` network - the
    # database is reachable only from the `web` container, never from
    # the internet.

networks:
  traefik:
    external: true
    name: traefik
  internal:
    driver: bridge
