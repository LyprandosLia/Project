name: Deploy to server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Sync files to server via rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete --exclude=.git --exclude=.github --exclude=data/ --exclude=.env
          path: ./
          remote_path: /srv/lyp/
          remote_host: deploy.nkyriopoulos.com
          remote_user: lyp
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Generate .env on server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: deploy.nkyriopoulos.com
          username: lyp
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            umask 077
            cat > /srv/lyp/.env <<'EOF'
            SITE_USERNAME=${{ secrets.SITE_USERNAME }}
            SITE_PASSWORD=${{ secrets.SITE_PASSWORD }}
            DB_NAME=${{ secrets.DB_NAME }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_ROOT_PASSWORD=${{ secrets.DB_ROOT_PASSWORD }}
            EOF

      - name: Restart docker compose
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: deploy.nkyriopoulos.com
          username: lyp
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            cd /srv/lyp
            docker compose -f docker-compose.yml down --remove-orphans || true
            docker compose -f docker-compose.yml up -d --build --remove-orphans